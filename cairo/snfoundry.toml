# sncast account + network config.
#
# Accounts live in ~/.starknet_accounts and are NEVER committed. `sncast account create`
# writes the key there; this file only names which one to use.

[sncast.sepolia]
account = "atrum_sepolia"
# Was Blast API, which has been shut down entirely -- it now answers every request with
# "Blast API is no longer available", and sncast surfaces that as a spec_version parse error
# that looks like a version incompatibility rather than a dead host.
url = "https://api.cartridge.gg/x/starknet/sepolia"

[sncast.mainnet]
account = "atrum_mainnet"
# Override with your own Alchemy endpoint -- the public one rate-limits hard.
url = "https://rpc.starknet.lava.build:443"
